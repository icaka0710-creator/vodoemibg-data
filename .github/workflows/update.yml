name: Обновяване на данните за язовирите
on:
  schedule:
    # Бюлетинът на МОСВ излиза сутрин – проверка всеки час между ~8 и ~17 ч. българско време
    - cron: '17 6-15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: LibreOffice (за .doc → HTML)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer > /dev/null
      - run: node build-dams.mjs
      - name: Запис при промяна
        run: |
          if ! git diff --quiet dams.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add dams.json
            git commit -m "Язовири: $(node -p 'require(\"./dams.json\").date')"
            git push
          fi
